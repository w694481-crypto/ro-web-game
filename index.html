<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ragnarok Idle RPG - 經典 RO 放置版</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: "Tahoma", "Microsoft JhengHei", sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #1a1a1a;
      overflow: hidden;
    }

    /* 主遊戲框架：滿版 16:9 風格佈局，背景為 RO 經典石磚圖案 */
    .game-viewport {
      width: 100vw;
      height: 100vh;
      background: #8e9098 url('https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png') repeat;
      background-size: 120px 120px;
      display: grid;
      grid-template-columns: 300px 1fr 220px;
      grid-template-rows: 1fr 210px;
      gap: 6px;
      padding: 6px;
      position: relative;
    }

    /* RO 原版風格視窗框 (淺色石膏半透明風格) */
    .ro-window {
      background: rgba(240, 244, 248, 0.92);
      border: 2px solid #a4b4c8;
      border-radius: 5px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.8);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 經典 RO 視窗天藍色標題列 */
    .ro-header {
      background: linear-gradient(180deg, #7bb3ed 0%, #4a8ddb 100%);
      padding: 3px 8px;
      font-size: 12px;
      font-weight: bold;
      color: #ffffff;
      text-shadow: 1px 1px 1px rgba(0,0,0,0.4);
      border-bottom: 1px solid #3b78c4;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 22px;
    }

    .ro-header-controls span {
      cursor: pointer;
      font-size: 11px;
      margin-left: 5px;
      padding: 0 3px;
      background: rgba(255,255,255,0.3);
      border-radius: 2px;
    }

    /* ================= 1. 左上角：RO 經典基本訊息視窗 ================= */
    .player-status-panel {
      grid-column: 1;
      grid-row: 1;
    }

    .status-body {
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      color: #333;
      font-size: 12px;
    }

    .char-top-info {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .char-avatar {
      width: 50px;
      height: 50px;
      border: 2px solid #8ca0be;
      border-radius: 4px;
      background: #fff;
      overflow: hidden;
      flex-shrink: 0;
    }

    .char-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .char-text-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .char-name-title {
      font-weight: bold;
      color: #1a3c6d;
      font-size: 13px;
    }

    /* RO 原版條狀圖 */
    .ro-bar-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-top: 2px;
    }

    .ro-bar-row {
      display: flex;
      align-items: center;
      font-size: 11px;
      gap: 6px;
    }

    .ro-bar-label {
      width: 55px;
      font-weight: bold;
      color: #444;
      text-align: right;
    }

    .ro-bar-container {
      flex-grow: 1;
      height: 13px;
      background: #e1e6ee;
      border: 1px solid #99a8bd;
      border-radius: 2px;
      position: relative;
      overflow: hidden;
    }

    .ro-bar-fill {
      height: 100%;
      transition: width 0.2s;
    }
