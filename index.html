<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RO 仙境傳說 - 放置版</title>
    <style>
        :root {
            --ro-bg: #e2ded0;
            --ro-panel: #f7f5ed;
            --ro-border: #807661;
            --ro-border-light: #ffffff;
            --ro-border-dark: #4a4336;
            --ro-header: #3a5375;
            --ro-text: #2d261e;
            --ro-hp: #ff4747;
            --ro-sp: #3a85ff;
            --ro-exp: #47c4ff;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--ro-bg);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--ro-text);
        }

        .game-window {
            width: 800px;
            background: var(--ro-panel);
            border: 3px solid var(--ro-border-dark);
            box-shadow: 3px 3px 0 var(--ro-border-light) inset, -3px -3px 0 var(--ro-border-dark) inset, 5px 5px 15px rgba(0,0,0,0.3);
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .window-header {
            background: linear-gradient(to right, #2b4162, #12100e);
            color: white;
            padding: 6px 12px;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .battle-stage {
            height: 320px;
            background: linear-gradient(to bottom, #7bc8f6 0%, #e8f4f8 70%, #9bc250 70%, #6e9928 100%);
            position: relative;
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            padding-bottom: 40px;
            border-bottom: 2px solid var(--ro-border);
        }

        .entity {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .sprite {
            height: 120px;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.4));
            object-fit: contain;
        }

        .name-tag {
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
            margin-bottom: 8px;
            border: 1px solid #ffde59;
        }

        .hp-bar-container {
            width: 100px;
            height: 10px;
            background: #222;
            border: 1px solid #fff;
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 6px;
        }

        .hp-bar-fill {
            height: 100%;
            background: linear-gradient(to bottom, #ff7b7b, #cc0000);
            width: 100%;
            transition: width 0.2s ease;
        }

        .hud-panel {
            padding: 15px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            background: #ede8d8;
        }

        .status-box {
            background: var(--ro-panel);
            border: 2px solid var(--ro-border);
            padding: 10px;
            border-radius: 4px;
        }

        .bar-group {
            margin-bottom: 8px;
        }

        .bar-label {
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 2px;
            display: flex;
            justify-content: space-between;
        }

        .bar {
            height: 14px;
            background: #333;
            border-radius: 3px;
            overflow: hidden;
            border: 1px solid #888;
        }

        .bar-hp { background: linear-gradient(to right, #ff4747, #ff8585); }
        .bar-sp { background: linear-gradient(to right, #3a85ff, #85b5ff); }
        .bar-exp { background: linear-gradient(to right, #00bfff, #80e5ff); }

        .battle-log {
            height: 110px;
            background: #1e1e1e;
            color: #4af626;
            font-family: monospace;
            padding: 8px;
            font-size: 12px;
            overflow-y: auto;
            border-radius: 4px;
            border: 1px solid #555;
        }

        .damage-popup {
            position: absolute;
            color: #ff3333;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 0px #000, -2px -2px 0px #000, 2px -2px 0px #000, -2px 2px 0px #000;
            animation: popup 0.8s ease-out forwards;
            pointer-events: none;
        }

        @keyframes popup {
            0% { opacity: 1; transform: translateY(0) scale(0.8); }
            50% { transform: translateY(-30px) scale(1.2); }
            100% { opacity: 0; transform: translateY(-50px) scale(1); }
        }
    </style>
</head>
<body>

<div class="game-window">
    <div class="window-header">
        <span>Ragnarok Online - Idle Web Edition</span>
        <span>Map: 普隆德拉 南門 (prt_fild08)</span>
    </div>

    <div class="battle-stage" id="stage">
        <!-- 玩家 -->
        <div class="entity" id="player-entity">
            <div class="name-tag">Lv.<span id="player-level">1</span> 初學者</div>
            <div class="hp-bar-container"><div class="hp-bar-fill" id="player-hp-bar"></div></div>
            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/25.gif" class="sprite" id="player-sprite" alt="Player">
        </div>

        <!-- 怪物 -->
        <div class="entity" id="monster-entity">
            <div class="name-tag" id="monster-name">波利</div>
            <div class="hp-bar-container"><div class="hp-bar-fill" id="monster-hp-bar"></div></div>
            <!-- 直接讀取你剛剛上傳的 poring1.gif 或 poring2.gif -->
            <img src="poring1.gif" class="sprite" id="monster-sprite" alt="Monster" onerror="this.onerror=null; this.src='poring2.gif';">
        </div>
    </div>

    <div class="hud-panel">
        <div class="status-box">
            <div class="bar-group">
                <div class="bar-label"><span>HP</span><span id="hp-text">100/100</span></div>
                <div class="bar"><div class="bar-fill bar-hp" id="hp-fill" style="width: 100%; height:100%;"></div></div>
            </div>
            <div class="bar-group">
                <div class="bar-label"><span>SP</span><span id="sp-text">30/30</span></div>
                <div class="bar"><div class="bar-fill bar-sp" id="sp-fill" style="width: 100%; height:100%;"></div></div>
            </div>
            <div class="bar-group">
                <div class="bar-label"><span>EXP</span><span id="exp-text">0%</span></div>
                <div class="bar"><div class="bar-fill bar-exp" id="exp-fill" style="width: 0%; height:100%;"></div></div>
            </div>
        </div>

        <div class="battle-log" id="battle-log">
            [系統] 歡迎來到 RO 放置版！戰鬥開始...<br>
        </div>
    </div>
</div>

<script>
    let player = { level: 1, hp: 100, maxHp: 100, sp: 30, maxSp: 30, atk: 12, exp: 0, maxExp: 30 };
    let monster = { name: '波利', hp: 50, maxHp: 50, atk: 5, expReward: 15 };

    function log(msg) {
        const logBox = document.getElementById('battle-log');
        logBox.innerHTML += msg + '<br>';
        logBox.scrollTop = logBox.scrollHeight;
    }

    function showDamage(targetEl, amount) {
        const popup = document.createElement('div');
        popup.className = 'damage-popup';
        popup.innerText = amount;
        targetEl.appendChild(popup);
        setTimeout(() => popup.remove(), 800);
    }

    function updateUI() {
        document.getElementById('player-level').innerText = player.level;
        document.getElementById('hp-text').innerText = `${player.hp}/${player.maxHp}`;
        document.getElementById('hp-fill').style.width = `${(player.hp / player.maxHp) * 100}%`;
        document.getElementById('player-hp-bar').style.width = `${(player.hp / player.maxHp) * 100}%`;

        document.getElementById('monster-hp-bar').style.width = `${(monster.hp / monster.maxHp) * 100}%`;
    }

    function gameLoop() {
        if (monster.hp > 0) {
            // 玩家攻擊怪物
            let dmg = player.atk + Math.floor(Math.random() * 5);
            monster.hp -= dmg;
            if (monster.hp < 0) monster.hp = 0;
            showDamage(document.getElementById('monster-entity'), dmg);
            log(`你對 ${monster.name} 造成了 ${dmg} 點傷害！`);

            if (monster.hp === 0) {
                log(`<span style="color:#ffff55;">擊敗了 ${monster.name}！獲得 ${monster.expReward} 經驗值。</span>`);
                player.exp += monster.expReward;
                if (player.exp >= player.maxExp) {
                    player.level++;
                    player.exp -= player.maxExp;
                    player.maxExp = Math.floor(player.maxExp * 1.5);
                    player.maxHp += 20;
                    player.hp = player.maxHp;
                    player.atk += 3;
                    log(`<span style="color:#ff77ff; font-weight:bold;">LEVEL UP! 你升到了 Lv.${player.level}！</span>`);
                }
                setTimeout(respawnMonster, 1500);
            }
        }

        updateUI();
    }

    function respawnMonster() {
        monster.hp = monster.maxHp;
        log(`${monster.name} 重生了！`);
        updateUI();
    }

    setInterval(gameLoop, 2000);
</script>

</body>
</html>
